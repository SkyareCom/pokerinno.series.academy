<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#061a17">
  <title>StackUp Academy · Pokerinno</title>
  <meta name="description" content="Sua primeira jornada na mesa. Descubra, pratique e evolua com Pokerinno.">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="google-play.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#home"><span class="spade">♠</span><span>STACKUP<small>ACADEMY</small></span></a>
    <div class="series">PRIMEIRA AVENTURA</div>
    <nav id="navigation"></nav>
    <div class="side-bottom">
      <span class="tiny">UM UNIVERSO DE POSSIBILIDADES</span>
      <p>Todo grande jogador<br>começa com uma descoberta.</p>
      <button class="quiet" data-pokerinno>Conheça Pokerinno ↗</button>
    </div>
  </aside>
  <div class="workspace">
    <header>
      <span class="breadcrumb">SUA JORNADA COMEÇA AQUI</span>
      <div class="header-actions">
        <button class="pokerinno-coach" data-pokerinno aria-label="Abrir mensagem do Pokerinno">
          <img src="assets/pokerinno-hero.webp" alt="">
          <span class="pokerinno-pulse" aria-hidden="true"></span>
        </button>
        <a href="#profile" class="avatar" aria-label="Perfil">♠</a>
      </div>
    </header>
    <main id="app"></main>
    <footer>STACKUP HOLD’EM <span>APRENDER</span></footer>
  </div>
  <nav class="mobile-nav" id="mobile-navigation" aria-label="Navegação principal"></nav>
  <dialog id="pokerinno-dialog" class="pokerinno-dialog">
    <button class="close pokerinno-close" aria-label="Fechar">×</button>
    <div class="pokerinno-stage">
      <video id="pokerinno-video" class="pokerinno-video" playsinline controls preload="metadata"></video>
      <div id="pokerinno-fallback" class="pokerinno-fallback">
        <img src="assets/pokerinno-hero.webp" alt="Pokerinno">
        <div class="pokerinno-bubble">
          <span class="eyebrow">POKERINNO · COACH</span>
          <h2 id="pokerinno-title">Olá!</h2>
          <p id="pokerinno-message"></p>
        </div>
      </div>
    </div>
    <div class="pokerinno-actions">
      <button type="button" class="quiet" data-pokerinno-replay>Repetir mensagem</button>
      <button type="button" class="primary" data-pokerinno-close>Continuar <span>→</span></button>
    </div>
  </dialog>
  <dialog id="dialog">
    <button class="close" aria-label="Fechar">×</button>
    <span class="eyebrow">POKERINNO · SEU COMPANHEIRO</span>
    <h2 id="dialog-title"></h2>
    <p id="dialog-body"></p>
    <button class="primary" id="dialog-action">Entendi <span>→</span></button>
  </dialog>
  <script type="module" src="app.js"></script>
</body>
</html>
