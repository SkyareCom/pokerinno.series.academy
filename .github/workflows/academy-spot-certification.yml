name: Academy Spot Certification Policy
on:
  push:
    branches: [feat/pokerinno-frontend]
    paths:
      - 'scripts/certify-spots.mjs'
      - 'scripts/certify-spots.test.mjs'
      - '.github/workflows/academy-spot-certification.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run independent certification policy tests
        run: node --test scripts/certify-spots.test.mjs
