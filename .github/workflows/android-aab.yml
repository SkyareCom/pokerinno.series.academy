name: Android AAB

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - "dist/**"
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-aab.yml"

jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test frontend
        run: npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare signing when configured
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :android:app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: pokerinno-academy-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
