name: Android AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Google Play versionCode"
        required: true
        default: "1"
      version_name:
        description: "Google Play versionName"
        required: true
        default: "1.0.0"
  pull_request:
    branches: [ main ]
    paths:
      - "dist/**"
      - "android/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-aab.yml"

jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test frontend
        run: npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Validate Play signing configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          configured=0
          [ -n "$ANDROID_KEYSTORE_BASE64" ] && configured=$((configured+1))
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && configured=$((configured+1))
          [ -n "$ANDROID_KEY_ALIAS" ] && configured=$((configured+1))
          [ -n "$ANDROID_KEY_PASSWORD" ] && configured=$((configured+1))
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 4 ]; then
            echo "Signing configuration is incomplete."
            exit 1
          fi
          if [ "$configured" -eq 4 ]; then
            echo "Play release signing is configured."
          else
            echo "Signing secrets are not configured; CI will validate an unsigned release bundle only."
          fi

      - name: Prepare signing when configured
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/android-keystore.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/android-keystore.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release bundle
        env:
          PLAY_VERSION_CODE: ${{ github.event.inputs.version_code || '1' }}
          PLAY_VERSION_NAME: ${{ github.event.inputs.version_name || '1.0.0' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :android:app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: pokerinno-academy-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
