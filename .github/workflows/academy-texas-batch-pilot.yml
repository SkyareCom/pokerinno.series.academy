name: Academy TexasSolver Batch Pilot
on:
  push:
    branches: [feat/pokerinno-frontend]
    paths: ['.github/workflows/academy-texas-batch-pilot.yml']
  workflow_dispatch:
    inputs:
      spot_ids:
        description: 'JSON list of postflop IDs, e.g. [725,726,727,728]'
        required: false
        default: '[725,726,727,728]'
      max_iterations:
        description: 'Solver iterations (diagnostic default 100)'
        required: false
        default: '100'
      dump_rounds:
        description: 'Strategy export rounds (diagnostic default 1)'
        required: false
        default: '1'
permissions:
  contents: read
jobs:
  texas-solver:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        spot_id: ${{ fromJSON(inputs.spot_ids || '[725,726,727,728]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate ten solver development layers
        run: node scripts/audit-solver-development-ten-layers.mjs
      - name: Validate twenty additional solver development layers
        run: node scripts/audit-solver-development-twenty-layers.mjs
      - name: Generate 780 independent-engine scenario inputs
        env:
          ACADEMY_SOLVER_SPOT_ID: ${{ matrix.spot_id }}
          ACADEMY_SOLVER_MAX_ITERATIONS: ${{ inputs.max_iterations || '100' }}
          ACADEMY_SOLVER_DUMP_ROUNDS: ${{ inputs.dump_rounds || '1' }}
        run: node scripts/prepare-texas-solver-inputs.mjs
      - name: Install independent solver toolchain
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libomp-dev
      - name: Checkout independently maintained TexasSolver source
        run: |
          mkdir -p reports/solver/independent
          git clone --recursive --branch console https://github.com/bupticybee/TexasSolver.git /tmp/academy-texas-solver
          git -C /tmp/academy-texas-solver checkout 6dfb65b4d7ed081da509e8d8c3d82138c4708267
          git -C /tmp/academy-texas-solver submodule update --init --recursive
          test "$(git -C /tmp/academy-texas-solver rev-parse HEAD)" = 6dfb65b4d7ed081da509e8d8c3d82138c4708267
          git -C /tmp/academy-texas-solver rev-parse HEAD | tee reports/solver/independent/texas-solver-commit.txt
          cp /tmp/academy-texas-solver/LICENSE* reports/solver/independent/ 2>/dev/null || true
      - name: Inspect TexasSolver build interfaces
        run: |
          find /tmp/academy-texas-solver -maxdepth 3 \( -name CMakeLists.txt -o -name Makefile -o -name README.md \) | tee reports/solver/independent/build-interfaces.txt
          test -f /tmp/academy-texas-solver/CMakeLists.txt
      - name: Compile independent engine
        run: |
          set -o pipefail
          cmake -S /tmp/academy-texas-solver -B /tmp/academy-texas-solver/build-academy -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 | tee reports/solver/independent/configure.log
          cmake --build /tmp/academy-texas-solver/build-academy -j 2 2>&1 | tee reports/solver/independent/build.log
          cmake --install /tmp/academy-texas-solver/build-academy 2>&1 | tee reports/solver/independent/install.log
      - name: Inventory built binaries
        run: |
          find /tmp/academy-texas-solver/build-academy -type f -executable | tee reports/solver/independent/binaries.txt
          find /tmp/academy-texas-solver/install -type f -executable 2>/dev/null | tee -a reports/solver/independent/binaries.txt
          test -s reports/solver/independent/binaries.txt
      - name: Execute one real independent solve (diagnostic only)
        continue-on-error: true
        timeout-minutes: 18
        run: |
          set -o pipefail
          cd /tmp/academy-texas-solver/install
          cp "$GITHUB_WORKSPACE/reports/solver/independent/selected-texas-input.txt" ./academy-spot-input.txt
          set +e
          timeout 900 ./console_solver -i academy-spot-input.txt 2>&1 | tee "$GITHUB_WORKSPACE/reports/solver/independent/texas-solver-run.log"
          solver_exit=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$solver_exit" > "$GITHUB_WORKSPACE/reports/solver/independent/texas-solver-exit-code.txt"
          if test -s academy-texas-result.json; then cp academy-texas-result.json "$GITHUB_WORKSPACE/reports/solver/independent/texas-solver-result.json"; fi
          test "$solver_exit" -eq 0
          grep -q 'Total exploitability' "$GITHUB_WORKSPACE/reports/solver/independent/texas-solver-run.log"
          test -s "$GITHUB_WORKSPACE/reports/solver/independent/texas-solver-result.json"
      - name: Audit actual TexasSolver convergence evidence
        if: always()
        continue-on-error: true
        run: node scripts/audit-texas-solver-run.mjs
      - name: Record independent certification limitations
        if: always()
        run: |
          printf '%s\n' 'Independent engine execution is diagnostic only. A result file without converged exploitability and cross-engine action-frequency agreement is NOT certification. 0 spots certified by this workflow.' > reports/solver/independent/certification-status.txt
      - name: Upload independent engine evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: academy-texas-batch-${{ matrix.spot_id }}-evidence
          path: reports/solver/independent/
