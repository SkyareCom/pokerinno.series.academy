name: Publish Academy Preview
on:
  push:
    branches: [main]
    paths:
      - 'dist/**'
      - '.github/workflows/pages-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: academy-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify simulator release files
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/simulator.js
          test -s dist/styles.css
          grep -q 'simulator-hole-cards' dist/simulator.js
          grep -q 'simulator-card-back' dist/styles.css
          grep -q 'simulator.js?v=222cb38' dist/app.js
          if grep -q 'JOGADOR 1' dist/simulator.js; then exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
