name: Publish Academy Preview

on:
  push:
    branches:
      - feat/pokerinno-frontend
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
          name: academy-preview-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: academy-preview-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 20); do
            count=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              | jq --arg name "$ARTIFACT_NAME" '[.artifacts[] | select(.name == $name)] | length')
            if [ "$count" = "1" ]; then exit 0; fi
            sleep 3
          done
          echo "Pages artifact metadata was not available in time."
          exit 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: academy-preview-${{ github.run_id }}-${{ github.run_attempt }}
