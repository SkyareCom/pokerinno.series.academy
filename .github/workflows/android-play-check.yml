name: Android Play build check
on:
  workflow_dispatch:
  push:
    branches: [chore/google-play-preparation]
    paths: ['android/**', 'dist/**', '.github/workflows/android-play-check.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" || test -x "$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          echo "ANDROID_HOME=$ANDROID_HOME"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Package local frontend
        run: |
          mkdir -p android/app/src/main/assets
          cp -a dist/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
      - name: Build unsigned Android App Bundle
        working-directory: android
        run: gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pokerinno-academy-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
