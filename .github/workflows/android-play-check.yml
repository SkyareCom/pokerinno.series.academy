name: Android Play build check
on:
  workflow_dispatch:
  push:
    branches: [chore/google-play-preparation]
    paths: ['android/**', 'dist/**', '.github/workflows/android-play-check.yml']
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Package local frontend
        run: |
          mkdir -p android/app/src/main/assets
          cp -a dist/. android/app/src/main/assets/
          test -s android/app/src/main/assets/index.html
      - name: Build unsigned Android App Bundle
        working-directory: android
        run: gradle :app:bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pokerinno-academy-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
